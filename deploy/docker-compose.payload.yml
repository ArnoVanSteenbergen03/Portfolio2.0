# Payload CMS stack for the Pi.
#
# Merge these two services into the SAME docker-compose.yml your other
# containers already use — one stack, one network, one backup routine.
#
# Changes from the original plan, and why:
#
#  1. DATABASE_URL, not DATABASE_URI. src/payload.config.ts now accepts either,
#     but DATABASE_URL is the name the Payload template actually reads. Getting
#     this wrong gives an empty connection string and a container that
#     crash-loops on boot.
#
#  2. Host port 3005, not 3001. Port 3001 on the Pi is already Uptime Kuma —
#     publishing Payload there would fail with "port is already allocated".
#     Update the cloudflared ingress and Tailscale bookmarks to match.
#
#  3. Postgres healthcheck + depends_on condition. Plain `depends_on` only waits
#     for the container to start, not for Postgres to accept connections, so
#     Payload would race it and fall over on a cold boot.
#
#  4. mem_limit raised to 640m. A Next.js server process idles around 200-300MB
#     and spikes higher on first request; 384m risks the kernel OOM-killing it
#     under load, which looks like random 502s through the tunnel.

services:
  payload-db:
    image: postgres:16-alpine
    container_name: payload-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: ${PAYLOAD_DB_PASSWORD:?set PAYLOAD_DB_PASSWORD in .env}
      POSTGRES_DB: payload
    volumes:
      - ./payload-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d payload']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 256m

  payload-cms:
    # Built by GitHub Actions (.github/workflows/cms-image.yml) and pulled here.
    # Never built on the Pi — 3.7GB RAM with ~2GB free is not enough for a
    # Next.js + Payload admin build, which gets OOM-killed partway through.
    #
    # Note: a literal <your-registry> placeholder here makes Compose fail with
    # "invalid reference format" and refuse to start ANY service in the file,
    # including payload-db.
    image: ghcr.io/arnovansteenbergen03/avsworks-cms:latest
    container_name: payload-cms
    restart: unless-stopped
    depends_on:
      payload-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://payload:${PAYLOAD_DB_PASSWORD}@payload-db:5432/payload
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?generate with openssl rand -base64 32}
      PAYLOAD_PUBLIC_SERVER_URL: https://cms.avsworks.be
      # Where the public site lives, so afterChange hooks can push updates to it.
      FRONTEND_URL: ${FRONTEND_URL}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?must match the frontend's value}
      # The origin you actually open /admin on. Must be listed, or Payload
      # rejects the login cookie on CSRF grounds with no useful error.
      ADMIN_ORIGIN: ${ADMIN_ORIGIN}
    ports:
      - '3005:3000'
    mem_limit: 640m

  # Completes the auto-deploy loop: push to main -> Actions builds and pushes to
  # GHCR -> watchtower notices the new image and restarts payload-cms with it.
  #
  # Scoped to payload-cms ONLY. Without that argument it would auto-update every
  # container on the Pi, which is not what you want for Home Assistant or
  # AdGuard — an unattended breaking update there takes down DNS for the house.
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # --cleanup removes the superseded image after each update; without it the
    # Pi's disk fills with old CMS layers.
    command: --interval 300 --cleanup payload-cms
    mem_limit: 64m
